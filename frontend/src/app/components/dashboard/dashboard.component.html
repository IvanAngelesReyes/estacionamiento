<div class="dashboard-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Alta de Vehículos</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="registroForm" (ngSubmit)="registrarVehiculo()">
        <mat-form-field appearance="outline" fullWidth>
          <mat-label>Placa</mat-label>
          <input matInput formControlName="placa" placeholder="Ej. ABC-123">
        </mat-form-field>
        <mat-form-field appearance="outline" fullWidth>
          <mat-label>Marca</mat-label>
          <input matInput formControlName="marca">
        </mat-form-field>
        <mat-form-field appearance="outline" fullWidth>
          <mat-label>Modelo</mat-label>
          <input matInput formControlName="modelo">
        </mat-form-field>
        <mat-form-field appearance="outline" fullWidth>
          <mat-label>Color</mat-label>
          <input matInput formControlName="color">
        </mat-form-field>
        <mat-form-field appearance="outline" fullWidth>
          <mat-label>Tipo de Vehículo</mat-label>
          <mat-select formControlName="tipo">
            <mat-option value="OFICIAL">Oficial</mat-option>
            <mat-option value="RESIDENTE">Residente</mat-option>
            <mat-option value="NO_RESIDENTE">No Residente</mat-option>
          </mat-select>
        </mat-form-field>
        <button mat-raised-button color="primary" type="submit" [disabled]="registroForm.invalid">Registrar</button>
      </form>
    </mat-card-content>
  </mat-card>

  <div class="right-panel">
    <mat-card>
      <mat-card-header>
        <mat-card-title>Control de Acceso</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <form [formGroup]="estanciaForm">
          <mat-form-field appearance="outline" fullWidth>
            <mat-label>Placa del Vehículo</mat-label>
            <input matInput formControlName="placa">
          </mat-form-field>
          <div class="button-row">
            <button mat-raised-button color="accent" (click)="registrarEntrada()">Entrada</button>
            <button mat-raised-button color="warn" (click)="registrarSalida()">Salida</button>
          </div>
        </form>
      </mat-card-content>
    </mat-card>

    <mat-card class="mt-20">
      <mat-card-header>
        <mat-card-title>Administración</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <button mat-stroked-button color="warn" (click)="reiniciarMes()">Reiniciar Mes</button>
      </mat-card-content>
    </mat-card>

    <mat-card style="margin-top: 20px;">
  <mat-card-header>
    <mat-card-title>Listado de Vehículos</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <table mat-table [dataSource]="vehiculos" style="width: 100%;">
      <ng-container matColumnDef="placa"><th mat-header-cell *matHeaderCellDef>Placa</th><td mat-cell *matCellDef="let v">{{v.placa}}</td></ng-container>
      <ng-container matColumnDef="marca"><th mat-header-cell *matHeaderCellDef>Marca</th><td mat-cell *matCellDef="let v">{{v.marca}}</td></ng-container>
      <ng-container matColumnDef="modelo"><th mat-header-cell *matHeaderCellDef>Modelo</th><td mat-cell *matCellDef="let v">{{v.modelo}}</td></ng-container>
      <ng-container matColumnDef="color"><th mat-header-cell *matHeaderCellDef>Color</th><td mat-cell *matCellDef="let v">{{v.color}}</td></ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </mat-card-content>
</mat-card>
  </div>
</div>
