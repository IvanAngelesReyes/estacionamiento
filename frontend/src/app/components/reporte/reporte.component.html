<div class="reporte-container">
  <h2>Reporte de Pagos - Residentes</h2>

  <mat-form-field appearance="outline">
    <mat-label>Filtrar por Placa</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Ej. DAS-423-1">
  </mat-form-field>

  <div class="mat-elevation-z8">
    <table mat-table [dataSource]="dataSource">

      <ng-container matColumnDef="placa">
        <th mat-header-cell *matHeaderCellDef> Placa </th>
        <td mat-cell *matCellDef="let element"> {{element.vehiculo?.placa}} </td>
      </ng-container>

      <ng-container matColumnDef="tiempoEstacionado">
        <th mat-header-cell *matHeaderCellDef> Tiempo Estacionado (min) </th>
        <td mat-cell *matCellDef="let element"> {{element.tiempoEstacionado}} </td>
      </ng-container>

      <ng-container matColumnDef="costoTotal">
        <th mat-header-cell *matHeaderCellDef> Costo Total </th>
        <td mat-cell *matCellDef="let element"> {{element.costoTotal | currency}} </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef> Estado / Acciones </th>
        <td mat-cell *matCellDef="let element">
          
          <button 
            mat-raised-button 
            color="primary" 
            *ngIf="!element.pagoRealizado" 
            (click)="pagarRegistro(element)">
            Pagar
          </button>

          <span *ngIf="element.pagoRealizado" class="badge-pagado">
            ✓ Pagado
          </span>

        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
  </div>
</div>
